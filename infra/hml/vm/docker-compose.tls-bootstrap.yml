name: spm-hml-tls-bootstrap

services:
    tls-bootstrap:
        image: ${CADDY_IMAGE:-caddy:2-alpine}
        restart: 'no'
        # Hard lifetime survives loss/SIGKILL of the operator SSH session.
        command: [timeout, '360', caddy, run, --config, /etc/caddy/Caddyfile, --adapter, caddyfile]
        environment:
            HML_DOMAIN: ${HML_DOMAIN:?Defina o hostname HML validado}
        security_opt: [no-new-privileges:true]
        cap_drop: [ALL]
        cap_add: [NET_BIND_SERVICE]
        ports:
            - '80:80'
            - '443:443'
        volumes:
            - ./Caddyfile.tls-bootstrap:/etc/caddy/Caddyfile:ro
            - caddy_data:/data
            - caddy_config:/config
        mem_limit: 96m
        memswap_limit: 192m
        pids_limit: 64
        logging:
            driver: json-file
            options:
                max-size: '1m'
                max-file: '1'

volumes:
    caddy_data:
        external: true
        name: spm-hml_caddy_data
    caddy_config:
        external: true
        name: spm-hml_caddy_config
