<app-header></app-header>

<router-outlet></router-outlet>

<app-footer></app-footer>

<button
    class="btn-back-to-top"
    [class.show]="showBackToTop"
    (click)="scrollToTop()"
    aria-label="Voltar ao topo"
>
    <i class="fas fa-arrow-up"></i>
</button>

<div class="mobile-sticky-bar">
    <div class="sticky-content">
        <span class="sticky-text">Ajude a transformar vidas</span>
        <button class="btn-sticky-donate">
            DOAR AGORA <i class="fas fa-heart pulse-icon"></i>
        </button>
    </div>
</div>

<div class="cookie-banner" *ngIf="!cookiesAccepted">
    <div class="cookie-content">
        <p>
            Utilizamos cookies para oferecer a melhor experiência e analisar o uso do nosso site. Ao
            continuar, você concorda com nossa <a href="#">Política de Privacidade</a>.
        </p>
        <div class="cookie-actions">
            <button class="btn-accept" (click)="acceptCookies()">Aceitar e Fechar</button>
        </div>
    </div>
</div>
