<header class="main-header" [class.scrolled]="isScrolled" [class.menu-open]="isMenuOpen">
    <div class="container header-wrapper">
        <div class="logo-area">
            <a routerLink="/" class="brand-link" (click)="closeMenu()">
                <img width="50" src="/logo-small-white.png" alt="Logo SPM"/>
            </a>
        </div>

        <button class="mobile-toggle" (click)="toggleMenu()" aria-label="Abrir Menu">
            <i class="fas" [class.fa-bars]="!isMenuOpen" [class.fa-times]="isMenuOpen"></i>
        </button>

        <nav class="nav-menu" [class.active]="isMenuOpen">
            <ul>
                <li><a routerLink="/" routerLinkActive="active" (click)="closeMenu()">Home</a></li>
                <li><a routerLink="/quem-somos" (click)="closeMenu()">Quem Somos</a></li>
                <li><a routerLink="/sobre" (click)="closeMenu()">Sobre Nós</a></li>
                <li><a routerLink="/impacto" (click)="closeMenu()">Impacto</a></li>
                <li><a routerLink="/noticias" (click)="closeMenu()">Notícias</a></li>
                <li><a routerLink="/contato" (click)="closeMenu()">Contato</a></li>

                <li class="mobile-only-btn">
                    <a href="#" class="btn-donate-mobile">Como Ajudar</a>
                </li>
            </ul>
        </nav>

        <div class="header-actions desktop-only">
            <a href="#" class="btn-donate">Como Ajudar</a>
        </div>
    </div>
</header>
