# =========================================================
# SPM Nacional — publicação do site no GitHub Pages
#
# O Pages serve arquivo estático, e o app é um Next.js com servidor. Quem
# resolve essa diferença é o `scripts/build-pages.mjs`: ele monta, a partir do
# mesmo código, só a parte pública do site, com o conteúdo lido do banco
# durante o build. O painel, o login e as rotas de API ficam de fora — não há
# como executá-los aqui.
#
# Requer, em Settings → Pages, a fonte configurada como
# **Deploy from a branch → gh-pages → / (root)**.
#
# O workflow escreve o site na branch `gh-pages` e quem publica dali é o
# próprio GitHub, no job interno "pages build and deployment". O envio à branch
# requer confirmação manual e respeita as proteções configuradas no environment demo.
#
# Demonstração manual: banco descartável e conteúdo de exemplo, sem dados reais.
# =========================================================

name: Publicar site no GitHub Pages

on:
    workflow_dispatch:
        inputs:
            confirm_demo:
                description: 'Publicar SOMENTE demonstração estática (sem painel/API)?'
                required: true
                type: boolean
                default: false

permissions:
    contents: read

# Duas publicações ao mesmo tempo brigam pelo push na gh-pages. A mais nova
# ganha: cancelar a anterior é seguro porque o build é reprodutível e o que
# vale é sempre o último commit.
concurrency:
    group: github-pages
    cancel-in-progress: true

jobs:
    publicar:
        if: inputs.confirm_demo
        name: Build estático e publicação
        runs-on: ubuntu-latest
        timeout-minutes: 20
        environment: demo

        permissions:
            # Único poder que o job precisa: escrever na branch gh-pages.
            contents: write

        services:
            # Banco descartável; nunca utiliza credenciais de produção.
            postgres:
                image: postgres:18.6-alpine
                env:
                    POSTGRES_USER: spm
                    POSTGRES_PASSWORD: spm
                    POSTGRES_DB: spmnacional
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 20

        steps:
            - name: Checkout do código
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  persist-credentials: false

            - name: Configurar Node.js
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: '22'
            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: '1.4.2'

            - name: Instalar dependências
              # O postinstall roda `prisma generate` e cria lib/generated/prisma,
              # que o build importa.
              run: bun install --frozen-lockfile

            - name: Configurar banco descartável de demonstração
              run: echo "DATABASE_URL=postgresql://spm:spm@localhost:5432/spmnacional?schema=public" >> "$GITHUB_ENV"

            - name: Preparar o banco de demonstração
              run: |
                  set -euo pipefail
                  bunx --no-install prisma migrate deploy
                  # O banco é descartável e o painel é removido do artefato. Ainda
                  # assim, o seed exige uma senha forte: gere uma exclusiva deste job,
                  # mantenha-a somente no ambiente do processo e nunca a imprima.
                  SEED_ADMIN_PASSWORD="$(node -e "process.stdout.write(require('node:crypto').randomBytes(48).toString('base64url'))")"
                  export SEED_ADMIN_PASSWORD
                  bunx --no-install prisma db seed
                  unset SEED_ADMIN_PASSWORD

            - name: Gerar o site estático
              env:
                  # Site de projeto: tudo vive sob /<nome-do-repo>. Se um dia o
                  # site ganhar domínio próprio, estas duas viram a raiz e a URL
                  # do domínio, e os caminhos deixam de ser prefixados.
                  PAGES_BASE_PATH: /${{ github.event.repository.name }}
                  PAGES_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
              run: bun run build:pages

            - name: Publicar na branch gh-pages
              uses: peaceiris/actions-gh-pages@329bcc8f12caed2cefe5a5b80781499a6f3b361b # v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./out
                  publish_branch: gh-pages
                  # A branch ainda carrega o build do site Angular antigo. Com
                  # órfão, cada publicação substitui a branch inteira em vez de
                  # empilhar arquivos que ninguém mais usa.
                  force_orphan: true
                  commit_message: 'site: ${{ github.sha }}'

            - name: Resumo
              run: |
                  {
                      echo "### Site publicado"
                      echo ""
                      echo "| Item | Valor |"
                      echo "| --- | --- |"
                      echo "| Commit | \`${GITHUB_SHA::7}\` |"
                      echo "| Endereço | https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ |"
                      echo "| Conteúdo | seed de demonstração, sem dados de produção |"
                  } >> "$GITHUB_STEP_SUMMARY"
