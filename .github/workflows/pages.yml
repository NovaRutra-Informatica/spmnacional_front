# =========================================================
# SPM Nacional — publicação do site no GitHub Pages
#
# O Pages serve arquivo estático, e o app é um Next.js com servidor. Quem
# resolve essa diferença é o `scripts/build-pages.mjs`: ele monta, a partir do
# mesmo código, só a parte pública do site, com o conteúdo lido do banco
# durante o build. O painel, o login e as rotas de API ficam de fora — não há
# como executá-los aqui.
#
# Requer, em Settings → Pages, a fonte configurada como
# **Deploy from a branch → gh-pages → / (root)**.
#
# O workflow escreve o site na branch `gh-pages` e quem publica dali é o
# próprio GitHub, no job interno "pages build and deployment". Por isso aqui
# não há `environment:` nem `deploy-pages`: este workflow termina no push, e a
# publicação em si não passa por aprovação de ambiente.
#
# De onde vem o conteúdo do site:
#   • com o segredo PAGES_DATABASE_URL configurado, do banco real;
#   • sem ele, de um Postgres descartável semeado com `prisma db seed`,
#     ou seja, do conteúdo de demonstração.
#
# Publicar algo pelo painel não muda o site sozinho: é preciso rodar este
# workflow de novo (push na dev, ou "Run workflow" na aba Actions).
# =========================================================

name: Publicar site no GitHub Pages

on:
    push:
        branches:
            - dev
    workflow_dispatch:

# Duas publicações ao mesmo tempo brigam pelo push na gh-pages. A mais nova
# ganha: cancelar a anterior é seguro porque o build é reprodutível e o que
# vale é sempre o último commit.
concurrency:
    group: github-pages
    cancel-in-progress: true

jobs:
    publicar:
        name: Build estático e publicação
        runs-on: ubuntu-latest

        permissions:
            # Único poder que o job precisa: escrever na branch gh-pages.
            contents: write

        services:
            # Banco descartável, usado só quando não há PAGES_DATABASE_URL.
            # Fica de pé sempre: subir um Postgres custa segundos e evita ter
            # que duplicar o job em duas versões.
            postgres:
                image: postgres:17-alpine
                env:
                    POSTGRES_USER: spm
                    POSTGRES_PASSWORD: spm
                    POSTGRES_DB: spmnacional
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd pg_isready
                    --health-interval 5s
                    --health-timeout 5s
                    --health-retries 20

        steps:
            - name: Checkout do código
              uses: actions/checkout@v4

            - name: Configurar Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Instalar dependências
              # O postinstall roda `prisma generate` e cria lib/generated/prisma,
              # que o build importa.
              run: npm ci

            - name: Escolher o banco do build
              id: banco
              env:
                  BANCO_EXTERNO: ${{ secrets.PAGES_DATABASE_URL }}
              run: |
                  set -euo pipefail
                  if [ -n "${BANCO_EXTERNO}" ]; then
                      echo "DATABASE_URL=${BANCO_EXTERNO}" >> "$GITHUB_ENV"
                      echo "semear=false" >> "$GITHUB_OUTPUT"
                      echo "Conteúdo vindo do banco de PAGES_DATABASE_URL."
                  else
                      echo "DATABASE_URL=postgresql://spm:spm@localhost:5432/spmnacional?schema=public" >> "$GITHUB_ENV"
                      echo "semear=true" >> "$GITHUB_OUTPUT"
                      echo "::warning::PAGES_DATABASE_URL não está configurada. O site vai ao ar com o conteúdo de demonstração do seed, e nada publicado pelo painel aparece nele."
                  fi

            - name: Preparar o banco de demonstração
              if: steps.banco.outputs.semear == 'true'
              run: |
                  set -euo pipefail
                  npx prisma migrate deploy
                  # O banco é descartável e o painel é removido do artefato. Ainda
                  # assim, o seed exige uma senha forte: gere uma exclusiva deste job,
                  # mantenha-a somente no ambiente do processo e nunca a imprima.
                  SEED_ADMIN_PASSWORD="$(node -e "process.stdout.write(require('node:crypto').randomBytes(48).toString('base64url'))")"
                  export SEED_ADMIN_PASSWORD
                  npx prisma db seed
                  unset SEED_ADMIN_PASSWORD

            - name: Gerar o site estático
              env:
                  # Site de projeto: tudo vive sob /<nome-do-repo>. Se um dia o
                  # site ganhar domínio próprio, estas duas viram a raiz e a URL
                  # do domínio, e os caminhos deixam de ser prefixados.
                  PAGES_BASE_PATH: /${{ github.event.repository.name }}
                  PAGES_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
              run: npm run build:pages

            - name: Publicar na branch gh-pages
              uses: peaceiris/actions-gh-pages@v4
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./out
                  publish_branch: gh-pages
                  # A branch ainda carrega o build do site Angular antigo. Com
                  # órfão, cada publicação substitui a branch inteira em vez de
                  # empilhar arquivos que ninguém mais usa.
                  force_orphan: true
                  commit_message: 'site: ${{ github.sha }}'

            - name: Resumo
              run: |
                  {
                      echo "### Site publicado"
                      echo ""
                      echo "| Item | Valor |"
                      echo "| --- | --- |"
                      echo "| Commit | \`${GITHUB_SHA::7}\` |"
                      echo "| Endereço | https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ |"
                      echo "| Conteúdo | ${{ steps.banco.outputs.semear == 'true' && 'seed de demonstração' || 'banco de PAGES_DATABASE_URL' }} |"
                  } >> "$GITHUB_STEP_SUMMARY"
