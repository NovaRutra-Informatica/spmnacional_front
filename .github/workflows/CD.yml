# O site deixou de ser estático: o Next.js roda em um servidor Node
# (painel administrativo, rotas dinâmicas). Por isso o deploy agora publica
# uma imagem Docker no GitHub Container Registry em vez de subir arquivos
# para o GitHub Pages.
#
# Depois que a imagem for publicada, basta apontar o serviço de hospedagem
# (Cloud Run, Fly.io, VPS com docker compose, etc.) para:
#   ghcr.io/<owner>/<repo>:latest

name: Publicar imagem Docker

on:
    workflow_dispatch:

permissions:
    contents: read

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}

jobs:
    quality:
        uses: ./.github/workflows/CI.yml
    build-and-push:
        needs: quality
        runs-on: ubuntu-latest
        timeout-minutes: 25

        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout do código
              uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  persist-credentials: false

            - name: Configurar Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

            - name: Autenticar no GitHub Container Registry
              uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Metadados da imagem
              id: meta
              uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=sha,format=long

            - name: Build e push
              uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
              with:
                  context: .
                  push: true
                  target: runner
                  pull: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
