# O site deixou de ser estático: o Next.js roda em um servidor Node
# (painel administrativo, rotas dinâmicas). Por isso o deploy agora publica
# uma imagem Docker no GitHub Container Registry em vez de subir arquivos
# para o GitHub Pages.
#
# Depois que a imagem for publicada, basta apontar o serviço de hospedagem
# (Cloud Run, Fly.io, VPS com docker compose, etc.) para:
#   ghcr.io/<owner>/<repo>:latest

name: Publicar imagem Docker

on:
    push:
        branches:
            - prod
    workflow_dispatch:

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}

jobs:
    build-and-push:
        runs-on: ubuntu-latest

        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout do código
              uses: actions/checkout@v4

            - name: Configurar Buildx
              uses: docker/setup-buildx-action@v3

            - name: Autenticar no GitHub Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Metadados da imagem
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=raw,value=latest
                      type=sha,format=short

            - name: Build e push
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
