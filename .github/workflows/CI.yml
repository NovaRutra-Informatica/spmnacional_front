name: CI

on:
    push:
    pull_request:

jobs:
    build-check:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout do código
              uses: actions/checkout@v3

            - name: Configurar Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: '22.17.0'
                  cache: 'npm'

            - name: Instalar dependências
              run: npm ci

            - name: Testar Build
              run: npm run build
