name: CI

on:
    push:
    pull_request:
    workflow_call:

permissions:
    contents: read

jobs:
    quality:
        name: Qualidade, segurança e testes
        runs-on: ubuntu-latest
        timeout-minutes: 30
        env:
            NEXT_TELEMETRY_DISABLED: '1'
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  persist-credentials: false
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: '22'
            - name: Set up Bun
              uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
              with:
                  bun-version: '1.4.2'
            - run: bun install --frozen-lockfile
            - run: bun audit --audit-level=high
            - name: Install checksum-verified Gitleaks
              run: |
                  set -euo pipefail
                  directory="$RUNNER_TEMP/gitleaks"
                  mkdir -p "$directory"
                  curl --fail --location --proto '=https' --tlsv1.2 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz' --output "$directory/gitleaks.tar.gz"
                  printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$directory/gitleaks.tar.gz" | sha256sum --check
                  tar -xzf "$directory/gitleaks.tar.gz" -C "$directory" gitleaks
                  echo "$directory" >> "$GITHUB_PATH"
            - run: bun run security:secrets
            - name: Verify exact secret-scanner allowlists and inventory boundaries
              run: node scripts/security-scan-smoke.mjs
            - run: bun run i18n:check
            - run: bun run lint
            - run: bun run typecheck
            - run: bun run test:coverage
            # Cada script cria/remove seu próprio Postgres de teste em porta aleatória.
            # Nenhuma credencial/URL do banco real é disponibilizada neste job.
            - run: bun run test:integration
            - run: bun run build
            - run: bunx --no-install playwright install --with-deps chromium
            - run: bun run test:e2e
            - run: bun run test:e2e:local
            - run: bun run test:e2e:analytics
            - name: Evidências dos testes
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: test-evidence
                  path: |
                      coverage/
                      playwright-report/
                      test-results/
                  if-no-files-found: ignore
                  retention-days: 7

    docker-check:
        name: Imagens de runtime e migração
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  persist-credentials: false
            - run: docker build --pull --target runner -t spmnacional-front:ci .
            - run: docker build --target migrator -t spmnacional-migrate:ci .
            - name: Conferir runtime sem root e sem arquivos sensíveis
              run: |
                  set -euo pipefail
                  for image in spmnacional-front:ci spmnacional-migrate:ci; do
                      docker run --rm --entrypoint sh "$image" -c 'test "$(id -u)" != 0 && test ! -d /app/infra && test ! -d /app/.git && test -z "$(find /app -path /app/node_modules -prune -o -type f \( -name ".env" -o -name ".env.*" -o -name "gha-creds-*.json" -o -name "*.tfstate" \) -print)"'
                  done
            - name: Recusar inicialização de produção sem configuração
              run: |
                  set -euo pipefail
                  name="spm-startup-check-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
                  cleanup() {
                      owner="$(docker inspect --format '{{index .Config.Labels "spm.ci-startup-check"}}' "$name" 2>/dev/null || true)"
                      if [ "$owner" = "$name" ]; then
                          docker rm --force "$name" >/dev/null
                      fi
                  }
                  trap cleanup EXIT
                  # Sem env do host, credenciais, rede, portas ou volumes.
                  docker run --detach --network none --name "$name" \
                    --label "spm.ci-startup-check=$name" spmnacional-front:ci >/dev/null
                  status="$(timeout 30s docker wait "$name")" || {
                      docker logs "$name"
                      echo "::error::Runtime não encerrou em até 30 segundos sem configuração."
                      exit 1
                  }
                  if [ "$status" != 1 ]; then
                      docker logs "$name"
                      echo "::error::Esperado exit 1 da validação; recebido: $status"
                      exit 1
                  fi
                  docker logs "$name" 2>&1 | grep -q '"event":"configuration.invalid"'

    terraform-check:
        name: Validar infraestrutura sem credenciais
        runs-on: ubuntu-latest
        timeout-minutes: 10
        defaults:
            run:
                working-directory: infra/terraform
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  persist-credentials: false
            - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
              with:
                  terraform_version: '1.14.5'
            - run: terraform fmt -check -recursive
            - run: terraform init -backend=false -input=false -lockfile=readonly
            - run: terraform validate -no-color
            - run: terraform test -no-color

    database-permissions:
        name: Privilégios mínimos do PostgreSQL
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  persist-credentials: false
            - run: ./infra/sql/test-runtime-role.ps1
              shell: pwsh
