name: Deploy no Google Cloud

on:
    workflow_dispatch:
        inputs:
            confirm_production:
                description: 'Confirmo requisitos de lançamento e compatibilidade das migrações'
                required: true
                type: boolean
                default: false

permissions:
    contents: read

concurrency:
    group: deploy-gcp-production
    cancel-in-progress: false

jobs:
    quality:
        uses: ./.github/workflows/CI.yml
    deploy:
        name: Migração, revisão candidata e promoção
        needs: quality
        if: github.ref == 'refs/heads/prod' && inputs.confirm_production
        runs-on: ubuntu-latest
        timeout-minutes: 45
        environment: production
        permissions:
            contents: read
            id-token: write
        env:
            PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
            REGION: ${{ vars.GCP_REGION }}
            REPO: ${{ vars.GCP_ARTIFACT_REPO }}
            SERVICE: ${{ vars.GCP_RUN_SERVICE }}
            MIGRATE_JOB: ${{ vars.GCP_RUN_MIGRATE_JOB }}
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  persist-credentials: false
            - name: Validar configuração
              run: |
                  set -euo pipefail
                  for name in PROJECT_ID REGION REPO SERVICE MIGRATE_JOB; do
                      test -n "${!name}" || { echo "::error::Variável ausente: $name"; exit 1; }
                  done
            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
            - uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed # v2
              with:
                  workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
                  service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
            - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2
              with:
                  project_id: ${{ env.PROJECT_ID }}
            - name: Conferir infraestrutura e registrar tráfego anterior
              id: previous
              run: |
                  set -euo pipefail
                  gcloud run services describe "$SERVICE" --region "$REGION" --format=json > "$RUNNER_TEMP/service.json"
                  gcloud run jobs describe "$MIGRATE_JOB" --region "$REGION" --format='value(metadata.name)' >/dev/null
                  # Rejeita configuração incompleta antes de executar migrações.
                  jq -e '.spec.template.spec.containers[0].env |
                    any(.name == "APP_URL" and (.value // "" | startswith("https://"))) and
                    any(.name == "STORAGE_DRIVER" and .value == "gcs") and
                    any(.name == "GCS_BUCKET" and (.value // "" | length > 0)) and
                    any(.name == "GOOGLE_OAUTH_ALLOWED_DOMAIN" and (.value // "" | length > 0)) and
                    any(.name == "GOOGLE_WORKSPACE_MFA_ENFORCED" and .value == "true") and
                    any(.name == "GOOGLE_OAUTH_CLIENT_ID" and (.valueFrom.secretKeyRef.key // "1" | tonumber > 1)) and
                    any(.name == "GOOGLE_OAUTH_CLIENT_SECRET" and (.valueFrom.secretKeyRef.key // "1" | tonumber > 1)) and
                    any(.name == "DATABASE_URL" and (.valueFrom.secretKeyRef.name // "" | endswith("-runtime-database-url")) and (.valueFrom.secretKeyRef.key // "1" | tonumber > 1))' "$RUNNER_TEMP/service.json" >/dev/null
                  previous="$(jq -r '[.status.traffic[] | select((.percent // 0) > 0) | "\(.revisionName)=\(.percent)"] | join(",")' "$RUNNER_TEMP/service.json")"
                  test -n "$previous"
                  echo "traffic=$previous" >> "$GITHUB_OUTPUT"
                  echo "url=$(jq -r '.status.url' "$RUNNER_TEMP/service.json")" >> "$GITHUB_OUTPUT"
                  gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
            - name: Identificar release
              id: release
              run: |
                  set -euo pipefail
                  base="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPO}"
                  echo "app=${base}/${SERVICE}" >> "$GITHUB_OUTPUT"
                  echo "migrator=${base}/${MIGRATE_JOB}" >> "$GITHUB_OUTPUT"
                  echo "tag=${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
                  echo "revision=${SERVICE}-r${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
                  echo "suffix=r${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
            - name: Construir e publicar runtime
              id: app
              uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
              with:
                  context: .
                  target: runner
                  platforms: linux/amd64
                  push: true
                  pull: true
                  tags: ${{ steps.release.outputs.app }}:${{ steps.release.outputs.tag }}
                  cache-from: type=gha,scope=app
                  cache-to: type=gha,mode=max,scope=app
                  provenance: mode=min
                  sbom: true
            - name: Construir e publicar migrador
              id: migrator
              uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
              with:
                  context: .
                  target: migrator
                  platforms: linux/amd64
                  push: true
                  pull: true
                  tags: ${{ steps.release.outputs.migrator }}:${{ steps.release.outputs.tag }}
                  cache-from: type=gha,scope=migrator
                  cache-to: type=gha,mode=max,scope=migrator
                  provenance: mode=min
                  sbom: true
            - name: Verificar compatibilidade das migrações com a revisão em serviço
              id: database_protocol
              env:
                  IMAGE: ${{ steps.release.outputs.migrator }}@${{ steps.migrator.outputs.digest }}
                  APP_IMAGE: ${{ steps.release.outputs.app }}@${{ steps.app.outputs.digest }}
                  PREVIOUS_TRAFFIC: ${{ steps.previous.outputs.traffic }}
              run: |
                  set -euo pipefail
                  verify_image_protocol() {
                    local image="$1" label
                    [[ "$image" =~ @sha256:[a-f0-9]{64}$ ]] || return 1
                    docker pull --quiet "$image" >/dev/null
                    label="$(docker image inspect --format '{{index .Config.Labels "org.spmnacional.database-protocol"}}' "$image")"
                    test "$label" = scoped-rls-v1 || { echo '::error::Imagem incompatível com o protocolo do banco; deploy/rollback bloqueado.'; return 1; }
                  }
                  verify_image_protocol "$APP_IMAGE"
                  verify_image_protocol "$IMAGE"
                  # Every revision eligible for traffic rollback must support the
                  # contract already applied to this database, even with no pending migration.
                  IFS=',' read -ra previous <<< "$PREVIOUS_TRAFFIC"
                  for assignment in "${previous[@]}"; do
                    revision="${assignment%%=*}"
                    old_image="$(gcloud run revisions describe "$revision" --region "$REGION" --format='value(status.imageDigest)')"
                    verify_image_protocol "$old_image"
                  done
                  echo 'verified=scoped-rls-v1' >> "$GITHUB_OUTPUT"
                  # Contract/unknown migrations require a separate maintenance release.
                  # Never migrate behind an incompatible live or rollback revision.
                  gcloud run jobs update "$MIGRATE_JOB" --region "$REGION" --image "$IMAGE" \
                    --command=node --args=scripts/lib/check-migrations.mjs,--mode=online,--app-protocol=scoped-rls-v1 --quiet
                  gcloud run jobs execute "$MIGRATE_JOB" --region "$REGION" --wait
            - name: Migrar o banco (somente expand compatível; nunca reset/seed)
              env:
                  IMAGE: ${{ steps.release.outputs.migrator }}@${{ steps.migrator.outputs.digest }}
              run: |
                  set -euo pipefail
                  gcloud run jobs update "$MIGRATE_JOB" --region "$REGION" --image "$IMAGE" \
                    --command=node --args=node_modules/prisma/build/index.js,migrate,deploy --quiet
                  gcloud run jobs execute "$MIGRATE_JOB" --region "$REGION" --wait
            - name: Criar revisão sem tráfego público principal
              env:
                  IMAGE: ${{ steps.release.outputs.app }}@${{ steps.app.outputs.digest }}
                  SUFFIX: ${{ steps.release.outputs.suffix }}
              run: |
                  set -euo pipefail
                  gcloud run deploy "$SERVICE" --region "$REGION" --image "$IMAGE" \
                    --revision-suffix "$SUFFIX" --no-traffic --tag candidate \
                    --liveness-probe='httpGet.path=/api/health/live,httpGet.port=3000,periodSeconds=30,timeoutSeconds=5,failureThreshold=3' --quiet
            - name: Testar readiness e páginas da candidata
              run: |
                  set -euo pipefail
                  url="$(gcloud run services describe "$SERVICE" --region "$REGION" --format=json | jq -r '.status.traffic[] | select(.tag == "candidate") | .url')"
                  test -n "$url"
                  for path in /api/health/live /api/health/ready / /atendente; do
                      code="$(curl --fail --silent --show-error --retry 6 --retry-all-errors \
                        --retry-delay 5 --connect-timeout 10 --max-time 20 \
                        --output "$RUNNER_TEMP/smoke-body" --write-out '%{http_code}' "$url$path")"
                      test "$code" = 200 || { echo "::error::Smoke falhou: $path HTTP $code"; exit 1; }
                      if [[ "$path" == /api/health/* ]]; then
                          jq -e '.status == "ok"' "$RUNNER_TEMP/smoke-body" >/dev/null
                      fi
                  done
            - name: Promover candidata
              id: promote
              env:
                  REVISION: ${{ steps.release.outputs.revision }}
              run: |
                  gcloud run services update-traffic "$SERVICE" --region "$REGION" \
                    --to-revisions "${REVISION}=100" --quiet
            - name: Verificar serviço após promoção
              env:
                  URL: ${{ steps.previous.outputs.url }}
              run: |
                  set -euo pipefail
                  curl --fail --silent --show-error --retry 3 --retry-all-errors \
                    --connect-timeout 10 --max-time 20 "${URL}/api/health/ready" | jq -e '.status == "ok"' >/dev/null
            - name: Restaurar tráfego anterior em falha após promoção
              if: failure() && steps.promote.outcome == 'success'
              env:
                  PREVIOUS_TRAFFIC: ${{ steps.previous.outputs.traffic }}
                  VERIFIED_PROTOCOL: ${{ steps.database_protocol.outputs.verified }}
                  MIGRATOR_IMAGE: ${{ steps.release.outputs.migrator }}@${{ steps.migrator.outputs.digest }}
              run: |
                  set -euo pipefail
                  test "$VERIFIED_PROTOCOL" = scoped-rls-v1
                  # Re-check the live database before routing requests to old code.
                  gcloud run jobs update "$MIGRATE_JOB" --region "$REGION" --image "$MIGRATOR_IMAGE" \
                    --command=node --args=scripts/lib/check-migrations.mjs,--mode=online,--app-protocol=scoped-rls-v1 --quiet
                  gcloud run jobs execute "$MIGRATE_JOB" --region "$REGION" --wait
                  gcloud run services update-traffic "$SERVICE" --region "$REGION" \
                    --to-revisions "$PREVIOUS_TRAFFIC" --quiet
                  echo "::error::Tráfego anterior restaurado. Migrações NÃO foram revertidas; investigar antes de repetir."
            - name: Remover URL temporária da candidata
              if: always() && steps.app.outcome == 'success'
              run: gcloud run services update-traffic "$SERVICE" --region "$REGION" --remove-tags candidate --quiet
            - name: Registrar release
              if: success()
              env:
                  IMAGE: ${{ steps.release.outputs.app }}@${{ steps.app.outputs.digest }}
                  REVISION: ${{ steps.release.outputs.revision }}
                  PREVIOUS_TRAFFIC: ${{ steps.previous.outputs.traffic }}
              run: |
                  {
                    echo "### Release promovida"
                    echo "- Commit: ${GITHUB_SHA}"
                    echo "- Imagem imutável: ${IMAGE}"
                    echo "- Revisão: ${REVISION}"
                    echo "- Tráfego anterior (rollback): ${PREVIOUS_TRAFFIC}"
                    echo "- Migrações: executadas com sucesso; não revertem junto com o código."
                  } >> "$GITHUB_STEP_SUMMARY"
