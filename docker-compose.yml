services:
    # ---------------------------------------------------------
    # Banco de dados
    # ---------------------------------------------------------
    db:
        image: postgres:18.6-alpine
        container_name: spm-db
        environment:
            POSTGRES_USER: spm
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
            POSTGRES_DB: spmnacional
            # Ordenação e acentuação corretas para português.
            LANG: pt_BR.utf8
        ports:
            # Porta alta no host para não conflitar com outros Postgres que
            # já rodem na máquina. Dentro da rede do compose os demais
            # serviços continuam falando com `db:5432`.
            - '127.0.0.1:${DB_HOST_PORT:-55432}:5432'
        volumes:
            - db_data:/var/lib/postgresql
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U spm -d spmnacional']
            interval: 5s
            timeout: 5s
            retries: 20
        restart: unless-stopped

    # ---------------------------------------------------------
    # Migrações — roda uma vez e sai
    #   docker compose run --rm migrate
    # ---------------------------------------------------------
    migrate:
        init: true
        security_opt:
            - no-new-privileges:true
        cap_drop: [ALL]
        pids_limit: 128
        build:
            context: .
            dockerfile: Dockerfile
            target: migrator
        image: spmnacional-migrate:latest
        container_name: spm-migrate
        depends_on:
            db:
                condition: service_healthy
        environment:
            DATABASE_URL: postgresql://spm:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}@db:5432/spmnacional?schema=public
        restart: 'no'

    # ---------------------------------------------------------
    # Aplicação (produção)
    # ---------------------------------------------------------
    web:
        init: true
        security_opt:
            - no-new-privileges:true
        cap_drop: [ALL]
        pids_limit: 256
        stop_grace_period: 30s
        logging:
            driver: json-file
            options:
                max-size: '10m'
                max-file: '3'
        build:
            context: .
            dockerfile: Dockerfile
            target: runner
        image: spmnacional-front:latest
        container_name: spm-web
        depends_on:
            db:
                condition: service_healthy
            migrate:
                condition: service_completed_successfully
        ports:
            # Porta do host configurável para conviver com outros projetos.
            - '${WEB_BIND_HOST:-127.0.0.1}:${WEB_HOST_PORT:-3000}:3000'
        environment:
            NODE_ENV: production
            DEPLOYMENT_TARGET: local
            NEXT_TELEMETRY_DISABLED: '1'
            DB_POOL_MAX: ${DB_POOL_MAX:-5}
            DATABASE_CONNECTION_TIMEOUT_MS: ${DATABASE_CONNECTION_TIMEOUT_MS:-5000}
            DATABASE_QUERY_TIMEOUT_MS: ${DATABASE_QUERY_TIMEOUT_MS:-10000}
            DATABASE_URL: postgresql://spm:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}@db:5432/spmnacional?schema=public
            APP_URL: ${APP_URL:-http://localhost:3000}
            AUTH_SECRET: ${AUTH_SECRET:?Defina AUTH_SECRET no arquivo .env}
            TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-}
            ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Defina ENCRYPTION_KEY no arquivo .env}
            STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
            GCS_BUCKET: ${GCS_BUCKET:-}
            STORAGE_LOCAL_DIR: /app/storage/uploads
            SMTP_HOST: ${SMTP_HOST:-}
            SMTP_PORT: ${SMTP_PORT:-587}
            SMTP_SECURE: ${SMTP_SECURE:-false}
            SMTP_USER: ${SMTP_USER:-}
            SMTP_PASSWORD: ${SMTP_PASSWORD:-}
            MAIL_FROM: ${MAIL_FROM:-SPM Nacional <contato@spmnacional.org.br>}
            MAIL_NOTIFY_TO: ${MAIL_NOTIFY_TO:-contato@spmnacional.org.br}
            GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
            GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
            GOOGLE_OAUTH_ALLOWED_DOMAIN: ${GOOGLE_OAUTH_ALLOWED_DOMAIN:-}
            GOOGLE_WORKSPACE_MFA_ENFORCED: ${GOOGLE_WORKSPACE_MFA_ENFORCED:-false}
            LOCAL_TEST_AUTH_ENABLED: ${LOCAL_TEST_AUTH_ENABLED:-false}
            LOCAL_TEST_AUTH_USER_ID: ${LOCAL_TEST_AUTH_USER_ID:-}
            TRANSLATION_ENABLED: ${TRANSLATION_ENABLED:-false}
            GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
            TRANSLATION_LOCATION: ${TRANSLATION_LOCATION:-global}
            TRANSLATION_DAILY_CHARACTER_LIMIT: ${TRANSLATION_DAILY_CHARACTER_LIMIT:-50000}
            GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-}
            GOOGLE_CALENDAR_API_KEY: ${GOOGLE_CALENDAR_API_KEY:-}
            CRON_SECRET: ${CRON_SECRET:?Defina CRON_SECRET no arquivo .env}
        volumes:
            - uploads:/app/storage/uploads
        restart: unless-stopped

    # ---------------------------------------------------------
    # Desenvolvimento com hot reload
    #   docker compose up --build dev
    # O serviço explícito inicia somente dev e suas dependências.
    # ---------------------------------------------------------
    dev:
        profiles: ['dev']
        build:
            context: .
            dockerfile: Dockerfile
            target: tooling
        image: spmnacional-dev:latest
        container_name: spm-dev
        working_dir: /app
        depends_on:
            db:
                condition: service_healthy
        command: sh -c "bun install --frozen-lockfile --linker hoisted && bunx prisma migrate deploy && bun run dev --hostname 0.0.0.0"
        ports:
            - '127.0.0.1:${DEV_HOST_PORT:-3001}:3000'
        volumes:
            - .:/app
            - dev_node_modules:/app/node_modules
            - dev_next_cache:/app/.next
            - dev_prisma_client:/app/lib/generated/prisma
        environment:
            NODE_ENV: development
            DEPLOYMENT_TARGET: local
            NEXT_TELEMETRY_DISABLED: '1'
            WATCHPACK_POLLING: 'true'
            GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
            GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
            GOOGLE_OAUTH_ALLOWED_DOMAIN: ${GOOGLE_OAUTH_ALLOWED_DOMAIN:-}
            GOOGLE_WORKSPACE_MFA_ENFORCED: ${GOOGLE_WORKSPACE_MFA_ENFORCED:-false}
            LOCAL_TEST_AUTH_ENABLED: ${LOCAL_TEST_AUTH_ENABLED:-false}
            LOCAL_TEST_AUTH_USER_ID: ${LOCAL_TEST_AUTH_USER_ID:-}
            # Desenvolvimento não traduz nem chama APIs cobradas por padrão.
            TRANSLATION_ENABLED: 'false'
            APP_URL: ${DEV_APP_URL:-http://localhost:${DEV_HOST_PORT:-3001}}
            DATABASE_URL: postgresql://spm:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}@db:5432/spmnacional?schema=public
            AUTH_SECRET: ${AUTH_SECRET:?Defina AUTH_SECRET no arquivo .env}
            TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-}
            ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Defina ENCRYPTION_KEY no arquivo .env}
            CRON_SECRET: ${CRON_SECRET:?Defina CRON_SECRET no arquivo .env}

volumes:
    db_data:
        name: spmnacional_front_db_data_pg18_20260922
    uploads:
    dev_node_modules:
    dev_next_cache:
    dev_prisma_client:
